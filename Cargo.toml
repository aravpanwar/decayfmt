[package]
name = "decayfmt"
version = "0.1.1"
edition = "2021"
description = "A file format where decay is a first-class property. Every open permanently corrupts the file."
license = "MIT"
repository = "https://github.com/aravpanwar/decayfmt"
readme = "README.md"
keywords = ["file-format", "corruption", "decay", "cli", "entropy"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["assets/", ".github/"]

[dependencies]
aes-gcm = "0.10"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
image = "0.25"
rand = "0.8"
zeroize = { version = "1", features = ["derive", "alloc"] }
tss-esapi = { version = "7", features = ["generate-bindings"] }

[profile.release]
strip = true


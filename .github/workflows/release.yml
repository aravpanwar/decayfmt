name: release

# Build and publish binaries when a version tag is pushed. Each target is built on
# a native runner, tested, packaged, and attached to the GitHub Release for the tag.
# Once every target has passed, the crate is published to crates.io.
on:
  push:
    tags:
      - "v*"

# The release upload needs permission to write to the repository's releases. The
# publish job requests its own id-token permission, since it needs an OIDC token.
permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: test
        run: cargo test --release

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: package (unix)
        if: runner.os != 'Windows'
        run: tar -czf "decayfmt-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" decayfmt

      - name: package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/decayfmt.exe" -DestinationPath "decayfmt-${{ matrix.target }}.zip"

      - name: attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: decayfmt-${{ matrix.target }}.*

  publish:
    name: publish to crates.io
    # Only after every target has built and tested, so a failing platform stops the
    # publish. A crates.io version can never be reused, unlike a GitHub release.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required to request the OIDC token that crates.io exchanges for a
      # short-lived publish token. No API token is stored in the repository.
      id-token: write
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: publish
        # The workspace contains decayfmt-py, which is publish = false and ships to
        # PyPI instead, so only the root crate is published here.
        run: cargo publish --package decayfmt
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
